[package]
name = "analytics"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "analytics"
path = "src/main.rs"

[[bin]]
name = "publish-sample"
path = "src/bin/publish_sample.rs"

[dependencies]
axum = "0.8"
bson = { version = "2", features = ["chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
lapin = "2"
mongodb = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
