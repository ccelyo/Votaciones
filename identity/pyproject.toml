[project]
name = "identity"
version = "0.1.0"
description = "Servicio de identidad: urnas, token anónimo (firma ciega) y cliente gRPC hacia ballot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44.0.0",
    "fastapi[standard]>=0.142.4",
    "grpcio>=1.70.0",
    "protobuf>=5.29.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.70.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
