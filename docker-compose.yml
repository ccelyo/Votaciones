# Entorno local completo de Espivota: frontend + gateway + servicios + bases de datos.
#
#   docker compose up --build
#
#   Frontend  https://localhost:3000  (otro puerto: WEB_PORT=3100 docker compose up --build)
#   Gateway   https://localhost:8088  (GATEWAY_PORT; catálogo de rutas en /api)
#             Los dos puertos los publica el WAF (servicio `waf`), no platform ni
#             gateway: toda petición externa pasa por TLS, ModSecurity y OWASP CRS.
#   Mobile    http://localhost:8092   (MOBILE_PORT; la app web llama al Gateway desde el navegador)
#   RabbitMQ  UI de gestión NO publicada; para desarrollo, en 127.0.0.1:15672:
#             docker compose -f docker-compose.yml -f docker-compose.rabbitmq-ui.yml up -d
#
# Platform, Gateway, Identity, Election, Ballot, Tally, Analytics, Notification,
# RabbitMQ y todas las bases de datos NO se publican en el host: se llega a la web y a la API
# solo a través del WAF, y a los servicios solo a través del Gateway.
#
# Segmentación de red (escenario de seguridad 3, Prototipo 3; base del Laboratorio 5):
#   1. Cada conexión entre servicios tiene su propia red (ver `networks:` al
#      final). Un servicio solo se ve con los que comparten red; las redes
#      `internal: true` no tienen salida a Internet ni al host.
#   2. Docker aísla por red, no por puerto. Por eso cada servicio que recibe
#      conexiones tiene un sidecar `<servicio>-fw` (security/netfw) con una ACL de
#      entrada: denegación por defecto, solo el puerto del servicio y solo desde
#      la red de quien lo llama. Los intentos denegados: docker compose logs <servicio>-fw
#   Verificación: bash docs/p3-network-segmentation/verify-segmentation.sh
#
# Usuarios de prueba (identity/seed_dev_users.sql): admin1..admin4 y votante1..votante10,
# contraseña "prueba123", código MFA "123456".
#
# Empezar de cero (borra usuarios, elecciones, votos y claves):
#   docker compose down -v
#
# Election en desarrollo acepta X-Dev-User / X-Dev-Roles sin token; el acceso
# externo sigue pasando por el Gateway TLS.
#
# SOLO DESARROLLO: las contraseñas y la clave de recibos de abajo son públicas.
# Para usar otra clave de recibos: BALLOT_RECEIPT_PRIVATE_KEY=... docker compose up

# Sidecar de ACL de entrada (security/netfw/acl.sh). Comparte el espacio de red del
# servicio (`network_mode: service:<servicio>`) y es el único con NET_ADMIN: un
# servicio comprometido no puede cambiar sus propias reglas. Si el servicio se
# recrea, Compose recrea también su sidecar.
x-netfw: &netfw
  build: ./security/netfw
  image: espivota/netfw:dev
  cap_add: [NET_ADMIN, NET_RAW]
  restart: unless-stopped

services:
  # Development-only CA and service certificates. Production must use
  # deployment-managed certificates instead.
  dev-certificates:
    build: ./security/dev-certs
    volumes: ["./.dev-certs:/certs"]
    # Solo escribe archivos: no necesita red.
    network_mode: none

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: votaciones
      POSTGRES_USER: votaciones
      POSTGRES_PASSWORD: votaciones
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez, con el volumen vacío.
      - ./identity/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./identity/seed_dev_users.sql:/docker-entrypoint-initdb.d/02-seed_dev_users.sql:ro
    networks: [identity-data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votaciones -d votaciones"]
      interval: 3s
      retries: 30

  # Census: base del padrón electoral, separada de la de Auth/Identity (vista C&C).
  postgres-census:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: census
      POSTGRES_USER: census
      POSTGRES_PASSWORD: census
    volumes:
      - census-data:/var/lib/postgresql/data
      - ./census/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [identity-data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U census -d census"]
      interval: 3s
      retries: 30

  # Firma ciega RSA. Solo es accesible desde Identity: sin `ports`, no se publica
  # al host y el Gateway no tiene ruta hacia él.
  blind-signature:
    build: ./blind-signature
    environment:
      # Secreto compartido con identity. Para cambiarlo: BLINDSIG_API_KEY=... docker compose up
      # (el valor por defecto es SOLO desarrollo, como las demás credenciales de este archivo).
      BLINDSIG_API_KEY: ${BLINDSIG_API_KEY:-dev-only-blindsig-token}
    volumes: ["blind-signature-keys:/app/keys"]
    expose: ["8100"]
    networks: [signer-net]

  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    networks: [ballot-data-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      retries: 30

  ballot:
    build: ./ballot
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: votaciones
      BALLOT_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      BALLOT_RECEIPT_PRIVATE_KEY: ${BALLOT_RECEIPT_PRIVATE_KEY:-NDmGYtqqwr1bI7YmEEWO+G18wItrcVOi4Ac/WAhGQbYLvTScxo+fKLPt8u1yAOf6ng9rs5uLswbN3fDoL056+Q==}
      BALLOT_GRPC_ADDR: 0.0.0.0:9091
      BALLOT_HTTP_TLS_CERT_FILE: /run/certs/tls.crt
      BALLOT_HTTP_TLS_KEY_FILE: /run/certs/tls.key
      BALLOT_HTTP_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      BALLOT_GRPC_TLS_CERT_FILE: /run/certs/tls.crt
      BALLOT_GRPC_TLS_KEY_FILE: /run/certs/tls.key
      BALLOT_GRPC_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      BALLOT_TLS_REQUIRED: "true"
      BALLOT_ALLOWED_ORIGINS: https://localhost:${WEB_PORT:-3000},https://127.0.0.1:${WEB_PORT:-3000}
      # Token compartido con Tally para el volcado interno de papeletas.
      BALLOT_TALLY_TOKEN: ${BALLOT_TALLY_TOKEN:-dev-tally-token}
    volumes:
      - ./.dev-certs/ballot:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    expose: ["8080", "9091"]
    networks:
      - gw-ballot-net     # lo llama el Gateway (HTTPS 8080)
      - vote-link-net     # lo llama Identity (gRPC 9091)
      - tally-ballot-net  # lo llama Tally (HTTPS 8080)
      - ballot-data-net   # su MongoDB
      - mq-ballot-net     # RabbitMQ

  # Ballot guarda los votos: el HTTP solo desde Gateway y Tally, el gRPC de
  # administración solo desde Identity.
  ballot-fw:
    <<: *netfw
    network_mode: service:ballot
    depends_on: [ballot]
    environment:
      FW_NAME: ballot
      FW_ALLOW: >-
        tcp:8080:10.89.31.0/24
        tcp:8080:10.89.41.0/24
        tcp:9091:10.89.40.0/24

  identity:
    build: ./identity
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-census:
        condition: service_healthy
      blind-signature:
        condition: service_healthy
      ballot:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://votaciones:votaciones@postgres:5432/votaciones
      IDENTITY_CENSUS_DATABASE_URL: postgresql://census:census@postgres-census:5432/census
      IDENTITY_BLIND_SIGNATURE_URL: http://blind-signature:8100
      IDENTITY_BLIND_SIGNATURE_API_KEY: ${BLINDSIG_API_KEY:-dev-only-blindsig-token}
      IDENTITY_BALLOT_GRPC_ADDR: ballot:9091
      IDENTITY_BALLOT_GRPC_TLS: "true"
      IDENTITY_BALLOT_GRPC_CA_FILE: /run/ca/ca.crt
      IDENTITY_BALLOT_GRPC_CERT_FILE: /run/certs/tls.crt
      IDENTITY_BALLOT_GRPC_KEY_FILE: /run/certs/tls.key
      IDENTITY_TLS_REQUIRED: "true"
      IDENTITY_TLS_CERT_FILE: /run/certs/tls.crt
      IDENTITY_TLS_KEY_FILE: /run/certs/tls.key
      IDENTITY_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      IDENTITY_ALLOWED_ORIGINS: https://localhost:${WEB_PORT:-3000},https://127.0.0.1:${WEB_PORT:-3000}
      IDENTITY_MFA_CODE: "123456"
    volumes:
      - identity-keys:/app/keys
      - ./.dev-certs/identity:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    expose: ["8000"]
    networks:
      - gw-identity-net    # lo llama el Gateway (HTTPS 8000)
      - identity-data-net  # postgres y postgres-census
      - signer-net         # llama a blind-signature (HTTP 8100)
      - vote-link-net      # llama a Ballot (gRPC 9091)

  identity-fw:
    <<: *netfw
    network_mode: service:identity
    depends_on: [identity]
    environment:
      FW_NAME: identity
      FW_ALLOW: tcp:8000:10.89.30.0/24

  # Base «Elections», exclusiva del servicio Election.
  postgres-elections:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elections
      POSTGRES_USER: elections
      POSTGRES_PASSWORD: elections
    volumes:
      - elections-data:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez, con el volumen vacío.
      - ./election/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [election-data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elections -d elections"]
      interval: 3s
      retries: 30

  election:
    build: ./election
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      postgres-elections:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ELECTION_DATABASE_URL: postgresql://elections:elections@postgres-elections:5432/elections
      ELECTION_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      ELECTION_JWT_SECRET: ${GATEWAY_JWT_SECRET:-}
      ELECTION_DEV_AUTH: "true"
      ELECTION_TLS_REQUIRED: "true"
      ELECTION_TLS_CERT_FILE: /run/certs/tls.crt
      ELECTION_TLS_KEY_FILE: /run/certs/tls.key
      ELECTION_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      ELECTION_ALLOWED_ORIGINS: https://localhost:${WEB_PORT:-3000},https://127.0.0.1:${WEB_PORT:-3000}
    volumes:
      - election-keys:/app/keys
      - ./.dev-certs/election:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    expose: ["8000"]
    # Ya no publica el puerto de desarrollo 8001, así que sale de dev-access-net.
    networks:
      - election-data-net  # postgres-elections
      - mq-election-net    # RabbitMQ

  # Nadie llama hoy a Election por red (el Gateway enruta /api/elections a
  # Identity): no acepta conexiones entrantes. Su healthcheck usa loopback.
  election-fw:
    <<: *netfw
    network_mode: service:election
    depends_on: [election]
    environment:
      FW_NAME: election
      FW_ALLOW: ""

  # Punto de entrada único de los clientes (web SSR, app móvil y CLI).
  gateway:
    build: ./gateway
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      ballot:
        condition: service_started
      analytics:
        condition: service_started
      notification:
        condition: service_started
      tally:
        condition: service_healthy
    environment:
      # Auth y Election aún viven dentro de identity: cuando se separen, solo
      # cambian estas URLs.
      GATEWAY_AUTH_URL: https://identity:8000
      GATEWAY_ELECTION_URL: https://identity:8000
      GATEWAY_IDENTITY_URL: https://identity:8000
      GATEWAY_BALLOT_URL: https://ballot:8080
      GATEWAY_ANALYTICS_URL: https://analytics:8090
      GATEWAY_NOTIFICATIONS_URL: https://notification:3000
      GATEWAY_TALLY_URL: https://tally:8092
      GATEWAY_TLS_REQUIRED: "true"
      GATEWAY_TLS_CERT_FILE: /run/certs/tls.crt
      GATEWAY_TLS_KEY_FILE: /run/certs/tls.key
      GATEWAY_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      GATEWAY_UPSTREAM_TLS_REQUIRED: "true"
      GATEWAY_UPSTREAM_TLS_CA_FILE: /run/ca/ca.crt
      GATEWAY_UPSTREAM_TLS_CERT_FILE: /run/certs/tls.crt
      GATEWAY_UPSTREAM_TLS_KEY_FILE: /run/certs/tls.key
      # El POST de Tally es síncrono: descuenta y responde con el conteo. Debe
      # poder superar el timeout global por defecto del Gateway (10 s).
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-70000}
      # JWT RS256 de identity: el Gateway solo usa la clave pública del JWKS, no
      # comparte ningún secreto. iss/aud deben coincidir con IDENTITY_JWT_ISSUER/_AUDIENCE.
      GATEWAY_JWKS_URL: https://identity:8000/.well-known/jwks.json
      GATEWAY_JWT_ISSUER: votaciones-identity
      GATEWAY_JWT_AUDIENCE: votaciones
      # Escenario 2 (Reverse Proxy, mediación completa): antes de reenviar una
      # petición autenticada, el Gateway comprueba la sesión en identity
      # (GET /auth/me, por gw-identity-net con mTLS). Un logout o una desactivación
      # tienen efecto en <= TTL de la caché (5 s) sin contactar el servicio destino.
      GATEWAY_SESSION_CHECK: identity
      GATEWAY_SESSION_CACHE_TTL_MS: ${GATEWAY_SESSION_CACHE_TTL_MS:-5000}
      GATEWAY_ALLOWED_ORIGINS: https://localhost:${WEB_PORT:-3000},https://127.0.0.1:${WEB_PORT:-3000},http://localhost:${MOBILE_PORT:-8092},http://127.0.0.1:${MOBILE_PORT:-8092}
      # Solo es seguro porque el WAF sobrescribe X-Forwarded-For con la IP real.
      GATEWAY_TRUST_FORWARDED_FOR: "true"
    volumes:
      - ./.dev-certs/gateway:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    expose: ["8088"]
    networks:
      - waf-api-net          # lo llama el WAF (API externa)
      - frontend-net         # lo llama Platform (SSR/BFF)
      - gw-identity-net
      - gw-ballot-net
      - gw-tally-net
      - gw-analytics-net
      - gw-notification-net

  # Los upstreams comparten red con el Gateway, pero no deben poder llamarlo.
  gateway-fw:
    <<: *netfw
    network_mode: service:gateway
    depends_on: [gateway]
    environment:
      FW_NAME: gateway
      FW_ALLOW: >-
        tcp:8088:10.89.21.0/24
        tcp:8088:10.89.22.0/24

  platform:
    build:
      context: ./platform
      args:
        NEXT_PUBLIC_API_MODE: api
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: https://gateway:8088
      PLATFORM_TLS_REQUIRED: "true"
      PLATFORM_TLS_CERT_FILE: /run/certs/tls.crt
      PLATFORM_TLS_KEY_FILE: /run/certs/tls.key
      PLATFORM_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      PLATFORM_GATEWAY_TLS_REQUIRED: "true"
      PLATFORM_GATEWAY_TLS_CA_FILE: /run/ca/ca.crt
      PLATFORM_GATEWAY_TLS_CERT_FILE: /run/certs/tls.crt
      PLATFORM_GATEWAY_TLS_KEY_FILE: /run/certs/tls.key
    volumes:
      - ./.dev-certs/platform:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    # Sin `ports`: el navegador entra por el WAF.
    expose: ["3000"]
    networks: [waf-web-net, frontend-net]

  # Solo el WAF entra a la web; el Gateway comparte frontend-net pero no la llama.
  platform-fw:
    <<: *netfw
    network_mode: service:platform
    depends_on: [platform]
    environment:
      FW_NAME: platform
      FW_ALLOW: tcp:3000:10.89.20.0/24

  # Web Application Firewall de borde (escenario de seguridad 4, Prototipo 3).
  # nginx + ModSecurity v3 + OWASP Core Rule Set 4 (LTS). Inspecciona cada
  # petición externa y bloquea con 403 las que superan el umbral de anomalía
  # (SQLi, XSS, path traversal, inyección de comandos, escáneres...). Ver waf/README.md.
  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-alpine-202610180210-lts
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      platform:
        condition: service_started
    environment:
      PORT: "8443"
      GATEWAY_PORT: "8444"
      WEB_BACKEND: https://platform:3000
      API_BACKEND: https://gateway:8088
      TLS_CERT_FILE: /run/certs/tls.crt
      TLS_KEY_FILE: /run/certs/tls.key
      TLS_CLIENT_CERT_FILE: /run/certs/tls.crt
      TLS_CLIENT_KEY_FILE: /run/certs/tls.key
      TLS_CA_FILE: /run/ca/ca.crt
      # Bloqueo por puntuación de anomalía con paranoia 1 (la recomendada para
      # producción). Para afinar sin bloquear: MODSEC_RULE_ENGINE=DetectionOnly.
      MODSEC_RULE_ENGINE: ${WAF_RULE_ENGINE:-On}
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: GET HEAD POST OPTIONS PUT PATCH DELETE
      # Registro de auditoría JSON en stdout: `docker compose logs waf`.
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
      SERVER_TOKENS: "off"
      SERVER_HEADER: ""
    volumes:
      - ./waf/nginx/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./.dev-certs/waf:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    ports:
      - "${WEB_PORT:-3000}:8443"
      - "${GATEWAY_PORT:-8088}:8444"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert /run/ca/ca.crt --cert /run/certs/tls.crt --key /run/certs/tls.key -A healthcheck https://localhost:8444/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Única red no interna del borde: es la que permite publicar los puertos.
    # Desde el WAF solo se alcanza a platform y gateway, por redes internas propias.
    networks:
      - edge-net
      - waf-web-net
      - waf-api-net

  # Solo se entra al WAF por los puertos publicados: cualquier cliente, pero solo
  # por su dirección en edge-net. Platform y Gateway comparten red con él, pero
  # no lo llaman.
  waf-fw:
    <<: *netfw
    network_mode: service:waf
    depends_on: [waf]
    environment:
      FW_NAME: waf
      FW_ALLOW: >-
        tcp:8443:0.0.0.0/0:10.89.10.0/24
        tcp:8444:0.0.0.0/0:10.89.10.0/24

  # La misma app Flutter, compilada para el navegador, para ver el flujo sin un teléfono.
  mobile:
    build:
      context: ./mobile
      args:
        GATEWAY_URL: https://localhost:${GATEWAY_PORT:-8088}
    ports: ["${MOBILE_PORT:-8092}:80"]
    # Solo sirve archivos estáticos; no llama a ningún servicio desde el contenedor.
    networks: [mobile-net]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # La topología se declara una vez al arrancar: exchanges duraderos, colas
    # con DLQ y bindings (ver tally/docs/events.md). Los servicios también la
    # declaran de forma idempotente, así que pueden arrancar sin este archivo.
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    # La UI de gestión (guest/guest) ya no se publica: desde una red no interna era
    # alcanzable por cualquier contenedor de otra red no interna (p. ej. el WAF).
    # Para desarrollo: docker compose -f docker-compose.yml -f docker-compose.rabbitmq-ui.yml up -d
    # Una red por cliente del broker: los clientes no se ven entre sí.
    networks:
      - mq-ballot-net
      - mq-election-net
      - mq-tally-net
      - mq-analytics-net
      - mq-notification-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # Solo AMQP y solo desde las redes de sus clientes; la API de gestión (15672)
  # queda cerrada para todos.
  rabbitmq-fw:
    <<: *netfw
    network_mode: service:rabbitmq
    depends_on: [rabbitmq]
    environment:
      FW_NAME: rabbitmq
      FW_ALLOW: >-
        tcp:5672:10.89.60.0/24
        tcp:5672:10.89.61.0/24
        tcp:5672:10.89.62.0/24
        tcp:5672:10.89.63.0/24
        tcp:5672:10.89.64.0/24

  # Servicio de escrutinio: lee las papeletas cifradas de Ballot, las descifra,
  # las cuenta y publica tally.completed. No tiene base de datos propia.
  tally:
    build: ./tally
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      ballot:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      TALLY_HTTP_ADDR: ":8092"
      BALLOT_URL: https://ballot:8080
      TALLY_TLS_REQUIRED: "true"
      TALLY_TLS_CERT_FILE: /run/certs/tls.crt
      TALLY_TLS_KEY_FILE: /run/certs/tls.key
      TALLY_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
      BALLOT_TLS_CA_FILE: /run/ca/ca.crt
      BALLOT_TLS_CERT_FILE: /run/certs/tls.crt
      BALLOT_TLS_KEY_FILE: /run/certs/tls.key
      TALLY_BALLOT_TOKEN: ${BALLOT_TALLY_TOKEN:-dev-tally-token}
      TALLY_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      TALLY_EXCHANGE: tally.events
      # P1 guarda la opción en claro; P2 puede desactivarlo con "false".
      TALLY_ALLOW_PLAINTEXT: "true"
      # Clave privada de la urna por defecto (opcional). También puede enviarse
      # en el cuerpo del POST que lanza el escrutinio.
      TALLY_PRIVATE_KEY: ${TALLY_PRIVATE_KEY:-}
      TALLY_PRIVATE_KEY_FILE: ${TALLY_PRIVATE_KEY_FILE:-}
      TALLY_HEALTHCHECK_URL: https://localhost:8092/healthz
    healthcheck:
      test: ["CMD", "/tally", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ./.dev-certs/tally:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    networks:
      - gw-tally-net      # lo llama el Gateway (HTTPS 8092)
      - tally-ballot-net  # llama a Ballot (HTTPS 8080)
      - mq-tally-net      # RabbitMQ

  tally-fw:
    <<: *netfw
    network_mode: service:tally
    depends_on: [tally]
    environment:
      FW_NAME: tally
      FW_ALLOW: tcp:8092:10.89.32.0/24

  # Base «Results» de analytics, separada de la de ballot.
  mongo-results:
    image: mongo:8.0
    volumes: ["results-data:/data/db"]
    networks: [results-data-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  analytics:
    build: ./analytics
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      mongo-results:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ANALYTICS_MONGODB_URI: mongodb://mongo-results:27017
      ANALYTICS_MONGODB_DATABASE: results
      ANALYTICS_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      ANALYTICS_TLS_REQUIRED: "true"
      ANALYTICS_TLS_CERT_FILE: /run/certs/tls.crt
      ANALYTICS_TLS_KEY_FILE: /run/certs/tls.key
      ANALYTICS_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
    volumes:
      - ./.dev-certs/analytics:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    expose: ["8090"]
    networks:
      - gw-analytics-net  # lo llama el Gateway (HTTPS 8090)
      - results-data-net  # mongo-results
      - mq-analytics-net  # RabbitMQ

  analytics-fw:
    <<: *netfw
    network_mode: service:analytics
    depends_on: [analytics]
    environment:
      FW_NAME: analytics
      FW_ALLOW: tcp:8090:10.89.33.0/24

  notifications-mongo:
    image: mongo:8.0
    volumes: ["notifications-data:/data/db"]
    networks: [notif-data-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  notification:
    build: ./notification
    depends_on:
      dev-certificates:
        condition: service_completed_successfully
      notifications-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URL: mongodb://notifications-mongo:27017
      MONGO_DATABASE: notifications
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      RABBIT_PREFETCH: 10
      NOTIFICATION_TLS_REQUIRED: "true"
      NOTIFICATION_TLS_CERT_FILE: /run/certs/tls.crt
      NOTIFICATION_TLS_KEY_FILE: /run/certs/tls.key
      NOTIFICATION_TLS_CLIENT_CA_FILE: /run/ca/ca.crt
    volumes:
      - ./.dev-certs/notification:/run/certs:ro
      - ./.dev-certs/ca-public:/run/ca:ro
    expose: ["3000"]
    networks:
      - gw-notification-net  # lo llama el Gateway (HTTPS 3000)
      - notif-data-net       # notifications-mongo
      - mq-notification-net  # RabbitMQ

  notification-fw:
    <<: *netfw
    network_mode: service:notification
    depends_on: [notification]
    environment:
      FW_NAME: notification
      FW_ALLOW: tcp:3000:10.89.34.0/24

# Subredes fijas 10.89.N.0/24: las ACL de los sidecars `*-fw` filtran por red de
# origen. Si chocan con una red del equipo, cambiar el bloque aquí y en los FW_ALLOW.
networks:
  # Entrada desde el host (no internas porque publican puertos). Las redes no
  # internas se enrutan entre sí a través del host: solo deben tener puntos de entrada.
  # (10.89.12.0/24 queda reservada a dev-access-net, en docker-compose.rabbitmq-ui.yml.)
  edge-net:          # waf: única entrada a la web y a la API
    ipam: { config: [{ subnet: 10.89.10.0/24 }] }
  mobile-net:        # mobile (solo archivos estáticos)
    ipam: { config: [{ subnet: 10.89.11.0/24 }] }

  # Borde: WAF -> cada servicio que protege, y Platform (SSR/BFF) -> Gateway.
  waf-web-net:   { internal: true, ipam: { config: [{ subnet: 10.89.20.0/24 }] } }  # waf -> platform
  waf-api-net:   { internal: true, ipam: { config: [{ subnet: 10.89.21.0/24 }] } }  # waf -> gateway
  frontend-net:  { internal: true, ipam: { config: [{ subnet: 10.89.22.0/24 }] } }  # platform -> gateway

  # Gateway -> cada servicio al que enruta.
  gw-identity-net:     { internal: true, ipam: { config: [{ subnet: 10.89.30.0/24 }] } }
  gw-ballot-net:       { internal: true, ipam: { config: [{ subnet: 10.89.31.0/24 }] } }
  gw-tally-net:        { internal: true, ipam: { config: [{ subnet: 10.89.32.0/24 }] } }
  gw-analytics-net:    { internal: true, ipam: { config: [{ subnet: 10.89.33.0/24 }] } }
  gw-notification-net: { internal: true, ipam: { config: [{ subnet: 10.89.34.0/24 }] } }

  # Conexiones entre servicios.
  vote-link-net:    { internal: true, ipam: { config: [{ subnet: 10.89.40.0/24 }] } }  # identity -> ballot (gRPC)
  tally-ballot-net: { internal: true, ipam: { config: [{ subnet: 10.89.41.0/24 }] } }  # tally -> ballot (HTTPS)
  signer-net:       { internal: true, ipam: { config: [{ subnet: 10.89.42.0/24 }] } }  # identity -> blind-signature

  # Cada base de datos solo la ve su dueño.
  identity-data-net: { internal: true, ipam: { config: [{ subnet: 10.89.50.0/24 }] } }  # identity -> postgres, postgres-census
  ballot-data-net:   { internal: true, ipam: { config: [{ subnet: 10.89.51.0/24 }] } }  # ballot -> mongo
  election-data-net: { internal: true, ipam: { config: [{ subnet: 10.89.52.0/24 }] } }  # election -> postgres-elections
  results-data-net:  { internal: true, ipam: { config: [{ subnet: 10.89.53.0/24 }] } }  # analytics -> mongo-results
  notif-data-net:    { internal: true, ipam: { config: [{ subnet: 10.89.54.0/24 }] } }  # notification -> notifications-mongo

  # RabbitMQ: una red por cliente, para que los clientes no se alcancen entre sí.
  mq-ballot-net:       { internal: true, ipam: { config: [{ subnet: 10.89.60.0/24 }] } }
  mq-election-net:     { internal: true, ipam: { config: [{ subnet: 10.89.61.0/24 }] } }
  mq-tally-net:        { internal: true, ipam: { config: [{ subnet: 10.89.62.0/24 }] } }
  mq-analytics-net:    { internal: true, ipam: { config: [{ subnet: 10.89.63.0/24 }] } }
  mq-notification-net: { internal: true, ipam: { config: [{ subnet: 10.89.64.0/24 }] } }

volumes:
  postgres-data:
  census-data:
  blind-signature-keys:
  mongo-data:
  identity-keys:
  elections-data:
  election-keys:
  results-data:
  notifications-data:
