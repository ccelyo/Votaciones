# Entorno local completo de Espivota: frontend + gateway + servicios + bases de datos.
#
#   docker compose up --build
#
#   Frontend  http://localhost:3000   (otro puerto: WEB_PORT=3100 docker compose up --build)
#   Gateway   http://localhost:8088   (GATEWAY_PORT; catálogo de rutas en /api)
#   Identity  http://localhost:8000   (IDENTITY_PORT)
#   Election  http://localhost:8001   (ELECTION_PORT)
#   Ballot    http://localhost:8080   (BALLOT_PORT)
#   Tally     interno (sin puerto en el host; se accede por el Gateway)
#   Analytics http://localhost:8090   (ANALYTICS_PORT)
#   RabbitMQ  http://localhost:15672  (RABBITMQ_UI_PORT, guest / guest)
#
# Usuarios de prueba (identity/seed_dev_users.sql): admin1..admin4 y votante1..votante10,
# contraseña "prueba123", código MFA "123456".
#
# Empezar de cero (borra usuarios, elecciones, votos y claves):
#   docker compose down -v
#
# Election en desarrollo acepta X-Dev-User / X-Dev-Roles sin token, p. ej.:
#   curl -H 'X-Dev-User: 1' -H 'X-Dev-Roles: admin' localhost:8001/elections
#
# SOLO DESARROLLO: las contraseñas y la clave de recibos de abajo son públicas.
# Para usar otra clave de recibos: BALLOT_RECEIPT_PRIVATE_KEY=... docker compose up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: votaciones
      POSTGRES_USER: votaciones
      POSTGRES_PASSWORD: votaciones
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez, con el volumen vacío.
      - ./identity/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./identity/seed_dev_users.sql:/docker-entrypoint-initdb.d/02-seed_dev_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votaciones -d votaciones"]
      interval: 3s
      retries: 30

  # Census: base del padrón electoral, separada de la de Auth/Identity (vista C&C).
  postgres-census:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: census
      POSTGRES_USER: census
      POSTGRES_PASSWORD: census
    volumes:
      - census-data:/var/lib/postgresql/data
      - ./census/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U census -d census"]
      interval: 3s
      retries: 30

  # Firma ciega RSA. Solo es accesible desde Identity: sin `ports`, no se publica
  # al host y el Gateway no tiene ruta hacia él.
  blind-signature:
    build: ./blind-signature
    environment:
      # Secreto compartido con identity. Para cambiarlo: BLINDSIG_API_KEY=... docker compose up
      # (el valor por defecto es SOLO desarrollo, como las demás credenciales de este archivo).
      BLINDSIG_API_KEY: ${BLINDSIG_API_KEY:-dev-only-blindsig-token}
    volumes: ["blind-signature-keys:/app/keys"]
    expose: ["8100"]

  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      retries: 30

  ballot:
    build: ./ballot
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: votaciones
      BALLOT_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      BALLOT_RECEIPT_PRIVATE_KEY: ${BALLOT_RECEIPT_PRIVATE_KEY:-NDmGYtqqwr1bI7YmEEWO+G18wItrcVOi4Ac/WAhGQbYLvTScxo+fKLPt8u1yAOf6ng9rs5uLswbN3fDoL056+Q==}
      BALLOT_GRPC_ADDR: 0.0.0.0:9091
      BALLOT_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      # Token compartido con Tally para el volcado interno de papeletas.
      BALLOT_TALLY_TOKEN: ${BALLOT_TALLY_TOKEN:-dev-tally-token}
    ports: ["${BALLOT_PORT:-8080}:8080"]

  identity:
    build: ./identity
    depends_on:
      postgres:
        condition: service_healthy
      postgres-census:
        condition: service_healthy
      blind-signature:
        condition: service_healthy
      ballot:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://votaciones:votaciones@postgres:5432/votaciones
      IDENTITY_CENSUS_DATABASE_URL: postgresql://census:census@postgres-census:5432/census
      IDENTITY_BLIND_SIGNATURE_URL: http://blind-signature:8100
      IDENTITY_BLIND_SIGNATURE_API_KEY: ${BLINDSIG_API_KEY:-dev-only-blindsig-token}
      IDENTITY_BALLOT_GRPC_ADDR: ballot:9091
      IDENTITY_BALLOT_GRPC_TLS: "false"
      IDENTITY_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      IDENTITY_MFA_CODE: "123456"
    volumes: ["identity-keys:/app/keys"]
    ports: ["${IDENTITY_PORT:-8000}:8000"]

  # Base «Elections», exclusiva del servicio Election.
  postgres-elections:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elections
      POSTGRES_USER: elections
      POSTGRES_PASSWORD: elections
    volumes:
      - elections-data:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez, con el volumen vacío.
      - ./election/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elections -d elections"]
      interval: 3s
      retries: 30

  election:
    build: ./election
    depends_on:
      postgres-elections:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ELECTION_DATABASE_URL: postgresql://elections:elections@postgres-elections:5432/elections
      ELECTION_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      ELECTION_JWT_SECRET: ${GATEWAY_JWT_SECRET:-}
      ELECTION_DEV_AUTH: "true"
      ELECTION_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
    volumes: ["election-keys:/app/keys"]
    ports: ["${ELECTION_PORT:-8001}:8000"]

  # Punto de entrada único de los clientes (web SSR, app móvil y CLI).
  gateway:
    build: ./gateway
    depends_on:
      identity:
        condition: service_healthy
      ballot:
        condition: service_started
      analytics:
        condition: service_started
      notification:
        condition: service_started
      tally:
        condition: service_healthy
    environment:
      # Auth y Election aún viven dentro de identity: cuando se separen, solo
      # cambian estas URLs.
      GATEWAY_AUTH_URL: http://identity:8000
      GATEWAY_ELECTION_URL: http://identity:8000
      GATEWAY_IDENTITY_URL: http://identity:8000
      GATEWAY_BALLOT_URL: http://ballot:8080
      GATEWAY_ANALYTICS_URL: http://analytics:8090
      GATEWAY_NOTIFICATIONS_URL: http://notification:3000
      GATEWAY_TALLY_URL: http://tally:8092
      # El POST de Tally es síncrono: descuenta y responde con el conteo. Debe
      # poder superar el timeout global por defecto del Gateway (10 s).
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-70000}
      # JWT RS256 de identity: el Gateway solo usa la clave pública del JWKS, no
      # comparte ningún secreto. iss/aud deben coincidir con IDENTITY_JWT_ISSUER/_AUDIENCE.
      GATEWAY_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GATEWAY_JWT_ISSUER: votaciones-identity
      GATEWAY_JWT_AUDIENCE: votaciones
      GATEWAY_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000},http://localhost:${MOBILE_PORT:-8092},http://127.0.0.1:${MOBILE_PORT:-8092}
      GATEWAY_TRUST_FORWARDED_FOR: "true"
    ports: ["${GATEWAY_PORT:-8088}:8088"]

  platform:
    build:
      context: ./platform
      args:
        NEXT_PUBLIC_API_MODE: api
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://gateway:8088
    ports: ["${WEB_PORT:-3000}:3000"]

  # La misma app Flutter, compilada para el navegador, para ver el flujo sin un teléfono.
  mobile:
    build:
      context: ./mobile
      args:
        GATEWAY_URL: http://localhost:${GATEWAY_PORT:-8088}
    ports: ["${MOBILE_PORT:-8092}:80"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # La topología se declara una vez al arrancar: exchanges duraderos, colas
    # con DLQ y bindings (ver tally/docs/events.md). Los servicios también la
    # declaran de forma idempotente, así que pueden arrancar sin este archivo.
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports: ["${RABBITMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # Servicio de escrutinio: lee las papeletas cifradas de Ballot, las descifra,
  # las cuenta y publica tally.completed. No tiene base de datos propia.
  tally:
    build: ./tally
    depends_on:
      ballot:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      TALLY_HTTP_ADDR: ":8092"
      BALLOT_URL: http://ballot:8080
      TALLY_BALLOT_TOKEN: ${BALLOT_TALLY_TOKEN:-dev-tally-token}
      TALLY_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
      TALLY_EXCHANGE: tally.events
      # P1 guarda la opción en claro; P2 puede desactivarlo con "false".
      TALLY_ALLOW_PLAINTEXT: "true"
      # Clave privada de la urna por defecto (opcional). También puede enviarse
      # en el cuerpo del POST que lanza el escrutinio.
      TALLY_PRIVATE_KEY: ${TALLY_PRIVATE_KEY:-}
      TALLY_PRIVATE_KEY_FILE: ${TALLY_PRIVATE_KEY_FILE:-}
    healthcheck:
      test: ["CMD", "/tally", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Base «Results» de analytics, separada de la de ballot.
  mongo-results:
    image: mongo:8.0
    volumes: ["results-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  analytics:
    build: ./analytics
    depends_on:
      mongo-results:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ANALYTICS_MONGODB_URI: mongodb://mongo-results:27017
      ANALYTICS_MONGODB_DATABASE: results
      ANALYTICS_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/%2f
    ports: ["${ANALYTICS_PORT:-8090}:8090"]

  notifications-mongo:
    image: mongo:8.0
    volumes: ["notifications-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  notification:
    build: ./notification
    depends_on:
      notifications-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URL: mongodb://notifications-mongo:27017
      MONGO_DATABASE: notifications
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      RABBIT_PREFETCH: 10
    ports: ["${NOTIFICATION_PORT:-8091}:3000"]

volumes:
  postgres-data:
  census-data:
  blind-signature-keys:
  mongo-data:
  identity-keys:
  elections-data:
  election-keys:
  results-data:
  notifications-data:
