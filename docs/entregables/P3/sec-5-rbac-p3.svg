ddle" font-size="12.5" fill="#1A7FA8" font-weight="400">solo si se autoriza</text><rect x="420" y="520" width="900" height="96" fill="#fff" stroke="#29A3D6" stroke-width="2"/><text x="436" y="542" text-anchor="start" font-size="12.5" fill="#1A7FA8" font-weight="600">ROLE_PERMISSIONS · core/permissions.py (única fuente de verdad, deny by default)</text><text x="436" y="566" text-anchor="start" font-size="12.5" fill="#222" font-weight="400">admin → users:read · users:write · census:read · census:write · elections:read · elections:manage · voting:participate</text><text x="436" y="588" text-anchor="start" font-size="12.5" fill="#222" font-weight="400">voter → voting:participate (parámetros, elegibilidad propia, firma ciega, confirmación)</text><text x="436" y="608" text-anchor="start" font-size="12" fill="#666" font-weight="400">rol desconocido → ningún permiso</text><path d="M135 690 L135 750 A85 10 0 0 0 305 750 L305 690" fill="#fff" stroke="#808080" stroke-width="3"/><ellipse cx="220" cy="690" rx="85" ry="10" fill="#fff" stroke="#808080" stroke-width="3"/><text x="220" y="726" text-anchor="middle" font-size="13.5" fill="#222" font-weight="400">Auth DB</text><text x="220" y="743" text-anchor="middle" font-size="11.5" fill="#666" font-weight="400">PostgreSQL · rol del usuario</text><text x="806" y="186" text-anchor="start" font-size="12" fill="#D32F2F" font-weight="600">votante → ruta admin: 403</text><text x="654" y="296" text-anchor="start" font-size="12" fill="#D32F2F" font-weight="600">si llega sin el permiso: 403</text><text x="654" y="312" text-anchor="start" font-size="12" fill="#D32F2F" font-weight="600">(defensa en profundidad)</text><rect x="60" y="790" width="1280" height="92" fill="#fafafa" stroke="#ddd"/><text x="80" y="814" text-anchor="start" font-size="13" fill="#222" font-weight="600">Notación</text><text x="140" y="842" text-anchor="start" font-size="12.5" fill="#222" font-weight="400">HTTPS (mTLS entre contenedores)</text><text x="414.6" y="842" tex