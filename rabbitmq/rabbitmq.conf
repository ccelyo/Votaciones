# Carga la topología declarativa al arrancar. Los consumidores la vuelven a
# declarar de forma idempotente, así que el broker también funciona sin este
# archivo (por ejemplo, en un despliegue que no monte el volumen).
management.load_definitions = /etc/rabbitmq/definitions.json

# Solo desarrollo: la UI y AMQP quedan en la red interna de Docker más los
# puertos publicados en docker-compose.yml.
loopback_users.guest = false
